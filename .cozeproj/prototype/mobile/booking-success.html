<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（橙色系，温暖亲和） === */
      --color-primary:              #F97316;
      --color-primary-container:    #FFF7ED;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（M3 色调系统 + Apple HIG 呼吸感） === */
      --color-background:                 #F9FAFB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F3F4F6;
      --color-surface-container-high:     #E5E7EB;
      --color-surface-container-highest:  #D1D5DB;
      /* === 文字 === */
      --color-on-surface:           #1F2433;
      --color-on-surface-variant:   #6B7280;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #374151;
      --color-outline-variant:  #D1D5DB;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 4px 12px rgba(0,0,0,0.06);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.08);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.12);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans flex flex-col min-h-screen">

  <!-- 顶部 Header（二级页，有返回按钮） -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <button id="header-back-btn" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <h1 id="header-title" class="text-base font-semibold text-on-surface">预约成功</h1>
    <div class="w-10 h-10"></div>
  </header>

  <main class="flex-1 overflow-y-auto pb-[env(safe-area-inset-bottom)]">
    <!-- @main-content:start -->

    <!-- 成功状态区域：居中布局，充足留白 -->
    <div class="flex flex-col items-center justify-center px-6 pt-12 pb-6">

      <!-- 绿色对勾图标（大号） -->
      <div id="success-icon" class="w-20 h-20 rounded-full bg-success/15 flex items-center justify-center mb-6">
        <i data-lucide="check" class="w-10 h-10 text-success"></i>
      </div>

      <!-- 预约成功标题 -->
      <h2 id="success-title" class="text-2xl font-bold text-on-surface mb-8">预约成功！</h2>

      <!-- 预约摘要卡片 -->
      <div id="booking-summary-card" class="w-full bg-surface rounded-2xl shadow-card p-5">
        <!-- 卡片标题 -->
        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-outline-variant/15">
          <i data-lucide="clipboard-list" class="w-4 h-4 text-primary"></i>
          <span class="text-sm font-semibold text-on-surface">预约详情</span>
        </div>

        <!-- 预约信息-服务名称 -->
        <div class="flex items-center justify-between py-2.5">
          <span class="text-sm text-on-surface-variant">服务名称</span>
          <span class="text-sm font-medium text-on-surface">经典剪发</span>
        </div>

        <!-- 预约信息-预约日期 -->
        <div class="flex items-center justify-between py-2.5">
          <span class="text-sm text-on-surface-variant">预约日期</span>
          <span class="text-sm font-medium text-on-surface">2025-06-15</span>
        </div>

        <!-- 预约信息-预约时段 -->
        <div class="flex items-center justify-between py-2.5">
          <span class="text-sm text-on-surface-variant">预约时段</span>
          <span class="text-sm font-medium text-on-surface">10:00</span>
        </div>

        <!-- 预约信息-联系人 -->
        <div class="flex items-center justify-between py-2.5">
          <span class="text-sm text-on-surface-variant">联系人</span>
          <span class="text-sm font-medium text-on-surface">小初</span>
        </div>

        <!-- 预约信息-手机号 -->
        <div class="flex items-center justify-between py-2.5">
          <span class="text-sm text-on-surface-variant">手机号</span>
          <span class="text-sm font-medium text-on-surface">138****0000</span>
        </div>
      </div>
    </div>

    <!-- 操作按钮区域 -->
    <div class="px-6 pt-4 pb-8 flex flex-col gap-3">
      <!-- 查看我的预约（橙色填充按钮） -->
      <button id="btn-view-appointments" class="w-full bg-primary text-on-primary py-3.5 rounded-xl text-base font-semibold
                     hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
        <i data-lucide="calendar-check" class="w-5 h-5"></i>
        查看我的预约
      </button>

      <!-- 返回首页（白底边框按钮） -->
      <button id="btn-back-home" class="w-full bg-surface text-on-surface border border-outline-variant/20 py-3.5 rounded-xl text-base font-semibold
                     hover:bg-surface-container active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
        <i data-lucide="home" class="w-5 h-5"></i>
        返回首页
      </button>
    </div>

    <!-- @main-content:end -->
  </main>

  <script>
    // 导航辅助函数
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }

    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }

    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }

    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    $(function () {
      // 返回按钮 - 返回上一页
      $('#header-back-btn').on('click', function () {
        navBack();
      });

      // 查看我的预约 - 跳转到预约记录页（使用 navReset，因为成功页不应保留在导航栈中）
      $('#btn-view-appointments').on('click', function () {
        navReset('appointments.html');
      });

      // 返回首页 - 跳转到首页（使用 navReset，清空导航栈回到首页）
      $('#btn-back-home').on('click', function () {
        navReset('home.html');
      });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
