<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（橙色系，温暖亲和） === */
      --color-primary:              #F97316;
      --color-primary-container:    #FFF7ED;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（M3 色调系统 + Apple HIG 呼吸感） === */
      --color-background:                 #F9FAFB;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #F3F4F6;
      --color-surface-container-high:     #E5E7EB;
      --color-surface-container-highest:  #D1D5DB;
      /* === 文字 === */
      --color-on-surface:           #1F2433;
      --color-on-surface-variant:   #6B7280;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #374151;
      --color-outline-variant:  #D1D5DB;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 4px 12px rgba(0,0,0,0.06);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.08);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.12);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
    /* Tab 下划线过渡动画 */
    .tab-indicator {
      transition: left 0.25s ease, width 0.25s ease;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans flex flex-col min-h-screen">

  <!-- @nav:start -->
  <!-- 顶部 Header（一级页无返回按钮） -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <button id="header-back-btn" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors" style="display:none;">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <h1 id="header-title" class="text-base font-semibold text-on-surface">预约记录</h1>
    <div class="w-10 h-10"></div>
  </header>

  <main class="flex-1 overflow-y-auto pb-[calc(3.5rem+env(safe-area-inset-bottom))]">
    <!-- @main-content:start -->

    <!-- Tab 切换栏 -->
    <div id="tab-bar" class="bg-surface sticky top-14 z-30">
      <div class="relative flex">
        <!-- Tab: 全部 -->
        <button id="tab-all" class="tab-btn flex-1 py-3 text-sm font-semibold text-primary text-center" data-status="all">全部</button>
        <!-- Tab: 待服务 -->
        <button id="tab-pending" class="tab-btn flex-1 py-3 text-sm font-medium text-on-surface-variant text-center" data-status="pending">待服务</button>
        <!-- Tab: 已完成 -->
        <button id="tab-completed" class="tab-btn flex-1 py-3 text-sm font-medium text-on-surface-variant text-center" data-status="completed">已完成</button>
        <!-- Tab: 已取消 -->
        <button id="tab-cancelled" class="tab-btn flex-1 py-3 text-sm font-medium text-on-surface-variant text-center" data-status="cancelled">已取消</button>
        <!-- 橙色下划线指示器 -->
        <div id="tab-indicator" class="tab-indicator absolute bottom-0 h-0.5 bg-primary rounded-full" style="left:0; width:25%;"></div>
      </div>
    </div>

    <!-- 预约记录列表 -->
    <div id="appointment-list" class="px-4 pt-3 space-y-3">

      <!-- 列表-预约1: 待服务 -->
      <div class="appointment-card bg-surface rounded-2xl shadow-card p-4 relative" data-status="pending" data-id="1">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0 pr-2">
            <h3 class="text-base font-bold text-on-surface truncate">经典精油SPA</h3>
            <p class="text-xs text-on-surface-variant mt-1">2025-06-15 10:00</p>
          </div>
          <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-primary/15 text-primary whitespace-nowrap">待服务</span>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-base font-bold text-primary">¥298</span>
          <button id="btn-cancel-1" class="btn-cancel text-sm font-medium text-error hover:opacity-80 active:opacity-70 transition-opacity py-2 px-3 -mr-3">取消预约</button>
        </div>
      </div>

      <!-- 列表-预约2: 待服务 -->
      <div class="appointment-card bg-surface rounded-2xl shadow-card p-4 relative" data-status="pending" data-id="2">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0 pr-2">
            <h3 class="text-base font-bold text-on-surface truncate">私教体态矫正课</h3>
            <p class="text-xs text-on-surface-variant mt-1">2025-06-16 14:00</p>
          </div>
          <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-primary/15 text-primary whitespace-nowrap">待服务</span>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-base font-bold text-primary">¥199</span>
          <button id="btn-cancel-2" class="btn-cancel text-sm font-medium text-error hover:opacity-80 active:opacity-70 transition-opacity py-2 px-3 -mr-3">取消预约</button>
        </div>
      </div>

      <!-- 列表-预约3: 已完成 -->
      <div class="appointment-card bg-surface rounded-2xl shadow-card p-4 relative" data-status="completed" data-id="3">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0 pr-2">
            <h3 class="text-base font-bold text-on-surface truncate">日式头皮护理</h3>
            <p class="text-xs text-on-surface-variant mt-1">2025-06-08 11:00</p>
          </div>
          <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-success/15 text-success whitespace-nowrap">已完成</span>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-base font-bold text-on-surface-variant">¥168</span>
        </div>
      </div>

      <!-- 列表-预约4: 已完成 -->
      <div class="appointment-card bg-surface rounded-2xl shadow-card p-4 relative" data-status="completed" data-id="4">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0 pr-2">
            <h3 class="text-base font-bold text-on-surface truncate">全身深层放松按摩</h3>
            <p class="text-xs text-on-surface-variant mt-1">2025-06-01 16:00</p>
          </div>
          <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-success/15 text-success whitespace-nowrap">已完成</span>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-base font-bold text-on-surface-variant">¥358</span>
        </div>
      </div>

      <!-- 列表-预约5: 已取消 -->
      <div class="appointment-card bg-surface rounded-2xl shadow-card p-4 relative" data-status="cancelled" data-id="5">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0 pr-2">
            <h3 class="text-base font-bold text-on-surface truncate">韩式皮肤管理</h3>
            <p class="text-xs text-on-surface-variant mt-1">2025-05-28 09:30</p>
          </div>
          <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-on-surface-variant/10 text-on-surface-variant whitespace-nowrap">已取消</span>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-base font-bold text-on-surface-variant line-through">¥228</span>
        </div>
      </div>

      <!-- 列表-预约6: 已取消 -->
      <div class="appointment-card bg-surface rounded-2xl shadow-card p-4 relative" data-status="cancelled" data-id="6">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0 pr-2">
            <h3 class="text-base font-bold text-on-surface truncate">瑜伽晨间冥想课</h3>
            <p class="text-xs text-on-surface-variant mt-1">2025-05-20 07:30</p>
          </div>
          <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-on-surface-variant/10 text-on-surface-variant whitespace-nowrap">已取消</span>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="text-base font-bold text-on-surface-variant line-through">¥128</span>
        </div>
      </div>

    </div>

    <!-- 取消预约确认弹窗 -->
    <div id="cancel-modal" class="fixed inset-0 bg-black/50 z-50 flex items-end" style="display:none;">
      <div class="bg-surface rounded-t-2xl w-full p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))]">
        <h3 class="text-lg font-bold text-on-surface text-center">确认取消预约</h3>
        <p id="cancel-modal-text" class="text-sm text-on-surface-variant text-center mt-2">确定要取消该预约吗？取消后需重新预约。</p>
        <div class="flex gap-3 mt-6">
          <button id="btn-modal-cancel" class="flex-1 bg-surface-container text-on-surface-variant border-none py-3.5 rounded-xl text-base font-semibold hover:bg-surface-container-high active:scale-[0.98] transition-all">再想想</button>
          <button id="btn-modal-confirm" class="flex-1 bg-error text-white border-none py-3.5 rounded-xl text-base font-semibold hover:opacity-90 active:scale-[0.98] transition-all">确认取消</button>
        </div>
      </div>
    </div>

    <!-- @main-content:end -->
  </main>

  <!-- 底部 TabBar（一级页专用） -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-surface flex justify-around items-center h-14 pb-[env(safe-area-inset-bottom)] border-t border-outline-variant/10">
    <a href="home.html" id="nav-home" class="tab-item flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant hover:text-on-surface transition-colors">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">首页</span>
    </a>
    <a href="appointments.html" id="nav-appointments" class="tab-item flex flex-col items-center gap-0.5 px-5 py-1.5 text-primary" aria-current="page">
      <i data-lucide="calendar-check" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">预约</span>
    </a>
    <a href="profile.html" id="nav-profile" class="tab-item flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant hover:text-on-surface transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">我的</span>
    </a>
  </nav>
  <!-- @nav:end -->

  <script>lucide.createIcons();</script>

  <script>
    // 导航辅助函数
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }

    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }

    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }

    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    $(function () {
      // === Tab 切换逻辑 ===
      var $tabBtns = $('.tab-btn');
      var $indicator = $('#tab-indicator');
      var $cards = $('.appointment-card');

      // 更新指示器位置
      function updateIndicator($activeTab) {
        var idx = $tabBtns.index($activeTab);
        var widthPercent = 100 / $tabBtns.length;
        $indicator.css({
          left: (idx * widthPercent) + '%',
          width: widthPercent + '%'
        });
      }

      // 初始化指示器
      updateIndicator($('#tab-all'));

      $tabBtns.on('click', function () {
        var $this = $(this);
        var status = $this.data('status');

        // 更新 Tab 样式
        $tabBtns.removeClass('text-primary font-semibold').addClass('text-on-surface-variant font-medium');
        $this.removeClass('text-on-surface-variant font-medium').addClass('text-primary font-semibold');

        // 移动指示器
        updateIndicator($this);

        // 筛选卡片
        if (status === 'all') {
          $cards.show();
        } else {
          $cards.hide();
          $cards.filter('[data-status="' + status + '"]').show();
        }
      });

      // === 取消预约逻辑 ===
      var pendingCancelId = null;

      // 点击"取消预约"按钮，弹出确认弹窗
      $('#appointment-list').on('click', '.btn-cancel', function (e) {
        e.stopPropagation();
        var $card = $(this).closest('.appointment-card');
        pendingCancelId = $card.data('id');
        var serviceName = $card.find('h3').text();
        $('#cancel-modal-text').text('确定要取消「' + serviceName + '」的预约吗？取消后需重新预约。');
        $('#cancel-modal').show();
      });

      // 弹窗：再想想
      $('#btn-modal-cancel').on('click', function () {
        $('#cancel-modal').hide();
        pendingCancelId = null;
      });

      // 弹窗：确认取消
      $('#btn-modal-confirm').on('click', function () {
        if (pendingCancelId !== null) {
          var $card = $('[data-id="' + pendingCancelId + '"]');
          // 更新卡片状态
          $card.attr('data-status', 'cancelled');
          // 更新状态标签
          $card.find('.status-badge')
            .removeClass('bg-primary/15 text-primary')
            .addClass('bg-on-surface-variant/10 text-on-surface-variant')
            .text('已取消');
          // 更新价格样式（划线）
          $card.find('.text-primary').first()
            .removeClass('text-primary')
            .addClass('text-on-surface-variant line-through');
          // 移除取消按钮
          $card.find('.btn-cancel').remove();
          // 关闭弹窗
          $('#cancel-modal').hide();
          pendingCancelId = null;

          // 如果当前 Tab 是"待服务"，需要隐藏此卡片
          var currentTab = $tabBtns.filter('.text-primary').data('status');
          if (currentTab === 'pending') {
            $card.hide();
          }
        }
      });

      // 点击弹窗遮罩关闭
      $('#cancel-modal').on('click', function (e) {
        if ($(e.target).is('#cancel-modal')) {
          $(this).hide();
          pendingCancelId = null;
        }
      });

      // === TabBar 导航 ===
      $('#nav-home').on('click', function (e) {
        e.preventDefault();
        navReset('home.html');
      });

      $('#nav-profile').on('click', function (e) {
        e.preventDefault();
        navReset('profile.html');
      });

      // === 卡片点击跳转服务详情 ===
      $('#appointment-list').on('click', '.appointment-card', function () {
        var serviceId = $(this).data('id');
        navPush('service-detail.html?id=' + serviceId);
      });
    });
  </script>
</body>

</html>
